# Lab / plain Compose. For Portainer Swarm + Traefik use stack.yml + PORTAINER.md.
# Entrypoint auto-enables the authenticated remote listener (3011).
services:
  ao:
    build:
      context: ../..
      dockerfile: deploy/headless/Dockerfile
    image: ao-headless:local
    restart: unless-stopped
    environment:
      AO_DATA_DIR: /ao-data
      AO_CHAT_HOST_MAX_TOTAL: ${AO_CHAT_HOST_MAX_TOTAL:-6}
      AO_CHAT_HOST_MAX_ORCH: ${AO_CHAT_HOST_MAX_ORCH:-2}
      AO_CHAT_HOST_MAX_WORKER: ${AO_CHAT_HOST_MAX_WORKER:-4}
    volumes:
      - ao-data:/ao-data
    # Map only if you terminate TLS/auth in front; prefer Tailscale to the host.
    # Port 3011 is the authenticated remote listener (ao remote-host enable).
    # ports:
    #   - "3011:3011"
    network_mode: bridge

volumes:
  ao-data:
