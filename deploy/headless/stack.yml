# Swarm stack for Portainer + Traefik (ao.subscribeit.pl).
#
# Portainer env (required):
#   AO_DOMAIN=ao.subscribeit.pl
#   TZ=Europe/Warsaw
#
# Image is rolling :latest from Actions. Durable state (DB + harness installs /
# logins) lives on the external volume ao_headless_data — NEVER tick "Remove
# volumes" when deleting/updating this stack.
#
# Swarm/Portainer only supports plain ${VAR} substitution — no ${VAR:-default}.
# Do NOT publish host ports 80/443. Network traefik-public must already exist.
version: "3.8"

services:
  ao:
    image: ghcr.io/dawid268/ao-headless:latest
    environment:
      TZ: ${TZ}
      AO_DATA_DIR: /ao-data
      # HOME and XDG_* are set in entrypoint onto /ao-data/home so Codex/Cursor
      # CLI installs survive image rebuilds.
      AO_CHAT_HOST_MAX_TOTAL: "3"
      AO_CHAT_HOST_MAX_ORCH: "1"
      AO_CHAT_HOST_MAX_WORKER: "2"
      AO_CHAT_HOST_PRESSURE_TOTAL: "2"
      AO_CHAT_HOST_PRESSURE_ORCH: "1"
      AO_CHAT_HOST_PRESSURE_WORKER: "1"
    volumes:
      - ao_data:/ao-data
    networks:
      - traefik-public
    # Drop privilege escalation. cap_drop ALL is omitted: git/gh need a normal
    # user capability set inside the image.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:3001/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "3.00"
          memory: 6G
        reservations:
          cpus: "0.50"
          memory: 1G
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
        failure_action: pause
      restart_policy:
        # on-failure only. Do not use any: a clean drain exit must not loop.
        # max_attempts omitted so a crash overnight keeps recovering.
        condition: on-failure
        delay: 20s
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.ao-headless.rule=Host(`${AO_DOMAIN}`)
        - traefik.http.routers.ao-headless.entrypoints=websecure
        - traefik.http.routers.ao-headless.tls=true
        - traefik.http.routers.ao-headless.tls.certresolver=letsencrypt
        - traefik.http.routers.ao-headless.service=ao-headless
        - traefik.http.routers.ao-headless-http.rule=Host(`${AO_DOMAIN}`) && !PathPrefix(`/.well-known/acme-challenge`)
        - traefik.http.routers.ao-headless-http.entrypoints=web
        - traefik.http.routers.ao-headless-http.middlewares=ao-headless-https
        - traefik.http.middlewares.ao-headless-https.redirectscheme.scheme=https
        - traefik.http.middlewares.ao-headless-https.redirectscheme.permanent=true
        - traefik.http.services.ao-headless.loadbalancer.server.port=3011
        - monitoring.io/health-path=/api/v1/identity

volumes:
  # Fixed absolute name (not stack-prefixed) so editor redeploys keep the same
  # disk. Never tick Portainer "Remove volumes".
  ao_data:
    name: ao_headless_data

networks:
  traefik-public:
    external: true
