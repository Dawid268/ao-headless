# Swarm stack for Portainer + Traefik (ao.subscribeit.pl).
#
# Portainer env (required):
#   AO_DOMAIN=ao.subscribeit.pl
#   AO_IMAGE=ghcr.io/dawid268/ao-headless:sha-b13c30f
#   TZ=Europe/Warsaw
#
# Swarm/Portainer only supports plain ${VAR} substitution — no ${VAR:-default}.
# Do NOT publish host ports 80/443. Network traefik-public must already exist.
version: "3.8"

services:
  ao:
    image: ${AO_IMAGE}
    environment:
      TZ: ${TZ}
      AO_DATA_DIR: /ao-data
      AO_CHAT_HOST_MAX_TOTAL: "3"
      AO_CHAT_HOST_MAX_ORCH: "1"
      AO_CHAT_HOST_MAX_WORKER: "2"
      AO_CHAT_HOST_PRESSURE_TOTAL: "2"
      AO_CHAT_HOST_PRESSURE_ORCH: "1"
      AO_CHAT_HOST_PRESSURE_WORKER: "1"
    volumes:
      - ao_data:/ao-data
    networks:
      - traefik-public
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:3001/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "3.00"
          memory: 6G
        reservations:
          cpus: "0.50"
          memory: 1G
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 3
        window: 180s
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.ao-headless.rule=Host(`${AO_DOMAIN}`)
        - traefik.http.routers.ao-headless.entrypoints=websecure
        - traefik.http.routers.ao-headless.tls=true
        - traefik.http.routers.ao-headless.tls.certresolver=letsencrypt
        - traefik.http.routers.ao-headless.service=ao-headless
        - traefik.http.routers.ao-headless-http.rule=Host(`${AO_DOMAIN}`) && !PathPrefix(`/.well-known/acme-challenge`)
        - traefik.http.routers.ao-headless-http.entrypoints=web
        - traefik.http.routers.ao-headless-http.middlewares=ao-headless-https
        - traefik.http.middlewares.ao-headless-https.redirectscheme.scheme=https
        - traefik.http.middlewares.ao-headless-https.redirectscheme.permanent=true
        - traefik.http.services.ao-headless.loadbalancer.server.port=3011
        - monitoring.io/health-path=/api/v1/identity

volumes:
  ao_data:

networks:
  traefik-public:
    external: true
