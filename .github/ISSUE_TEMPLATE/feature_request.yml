name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first.

        Feature requests wait for discussion on a contributor call and core-team approval on the issue before implementation or PR review. The `needs-discussion` label means approval is still pending. See the [contributing guide](https://github.com/OrchestratorInc/agent-orchestrator/blob/main/CONTRIBUTING.md#bugs-and-features).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you hitting? Who does this affect?
      placeholder: As a … I need … because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Rough idea of what good looks like. Design sketches welcome; keep it optional.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already tried.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues / discussions for something similar
          required: true
